name: Internal testing distribution
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      version:
        type: string
        required: true
      build_number:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: internal-testing
  cancel-in-progress: false
jobs:
  testflight:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PREGO_VERSION_NAME: ${{ inputs.version }}
      PREGO_BUILD_NUMBER: ${{ inputs.build_number }}
      VITE_PURCHASES_ENABLED: 'false'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'NVJ5UY3T2X' }}
      APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 || secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 || secrets.IOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check TestFlight configuration
        run: node scripts/check-beta-config.mjs ios
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Prepare temporary signing credentials
        run: scripts/prepare-ios-signing.sh
      - name: Archive signed iOS candidate
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Prego.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$(cat "$RUNNER_TEMP/prego-signing/profile-uuid")" MARKETING_VERSION="$PREGO_VERSION_NAME" CURRENT_PROJECT_VERSION="$PREGO_BUILD_NUMBER" archive
      - name: Export App Store IPA
        run: xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Prego.xcarchive" -exportPath "$RUNNER_TEMP/prego-ipa" -exportOptionsPlist "$RUNNER_TEMP/prego-signing/ExportOptions.plist"
      - name: Preserve signed build and checksum
        run: shasum -a 256 "$RUNNER_TEMP/prego-ipa/"*.ipa > "$RUNNER_TEMP/prego-ipa/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/prego-ipa/
          retention-days: 14
      - name: Upload to App Store Connect for TestFlight processing
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/prego-signing
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/prego-ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo 'Upload accepted. Confirm processing, export compliance and internal tester access in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/prego-signing/profile-uuid" ]; then
            PROFILE_UUID=$(cat "$RUNNER_TEMP/prego-signing/profile-uuid")
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "$RUNNER_TEMP/prego-signing/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/prego-signing"
  play-internal:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREGO_VERSION_NAME: ${{ inputs.version }}
      PREGO_BUILD_NUMBER: ${{ inputs.build_number }}
      VITE_PURCHASES_ENABLED: 'false'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      PREGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PREGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PREGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Google Play configuration
        run: node scripts/check-beta-config.mjs android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Prepare temporary upload credentials
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          root.joinpath('prego-upload.jks').write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          root.joinpath('play-service-account.json').write_text(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
          PY
      - name: Build signed internal testing bundle
        env:
          PREGO_KEYSTORE_PATH: ${{ runner.temp }}/prego-upload.jks
        run: ./gradlew bundleRelease lintRelease
        working-directory: android
      - name: Verify bundle signature and checksum
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as bundle:
              names = bundle.namelist()
              if not any(name.startswith('META-INF/') and name.endswith(('.RSA', '.EC', '.DSA')) for name in names):
                  raise SystemExit('Bundle is unsigned; refusing upload.')
          PY
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: play-internal-${{ inputs.version }}-${{ inputs.build_number }}
          path: android/app/build/outputs/bundle/release/
          retention-days: 14
      - name: Upload only to Google Play internal testing
        run: |
          python3 -m pip install 'google-auth==2.40.3' 'requests==2.32.5'
          python3 scripts/upload-play-internal.py --credentials "$RUNNER_TEMP/play-service-account.json" --bundle android/app/build/outputs/bundle/release/app-release.aab --build-number "$PREGO_BUILD_NUMBER" --version "$PREGO_VERSION_NAME"
          echo 'Internal-track edit committed. Confirm Play processing, tester list and opt-in access in Play Console.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove upload credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/prego-upload.jks" "$RUNNER_TEMP/play-service-account.json"
