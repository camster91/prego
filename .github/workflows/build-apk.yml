name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prego-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build APK (release unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prego-apk-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: prego-apk-debug
          path: ./apk

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: prego-apk-release-unsigned
          path: ./apk

      - name: Rename APKs with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv ./apk/app-debug.apk ./apk/prego-${VERSION}-debug.apk
          mv ./apk/app-release-unsigned.apk ./apk/prego-${VERSION}-release-unsigned.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
